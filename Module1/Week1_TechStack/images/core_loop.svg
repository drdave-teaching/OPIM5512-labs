<svg viewBox="0 0 920 280" width="920" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The core Git loop you repeat every session</title>
  <desc>Pull the latest, edit and save in VS Code, review the diff, commit a snapshot, push to GitHub, then repeat.</desc>
  <rect x="0" y="0" width="920" height="280" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="279" rx="14" fill="none" stroke="#d0d7de"/>

  <text x="460" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">The core loop — you'll do this thousands of times</text>

  <!-- 5 step boxes -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="30"  y="78" width="150" height="74" rx="10" fill="#0969da"/>
    <rect x="208" y="78" width="150" height="74" rx="10" fill="#6e40c9"/>
    <rect x="386" y="78" width="150" height="74" rx="10" fill="#57606a"/>
    <rect x="564" y="78" width="150" height="74" rx="10" fill="#6e40c9"/>
    <rect x="742" y="78" width="150" height="74" rx="10" fill="#1a7f37"/>
  </g>

  <g text-anchor="middle" fill="#ffffff">
    <text x="105" y="110" font-size="15" font-weight="700">1. Pull</text>
    <text x="105" y="130" font-size="12">get latest</text>

    <text x="283" y="110" font-size="15" font-weight="700">2. Edit</text>
    <text x="283" y="130" font-size="12">+ save (VS Code)</text>

    <text x="461" y="110" font-size="15" font-weight="700">3. Review</text>
    <text x="461" y="130" font-size="12">read the diff</text>

    <text x="639" y="110" font-size="15" font-weight="700">4. Commit</text>
    <text x="639" y="130" font-size="12">snapshot it</text>

    <text x="817" y="110" font-size="15" font-weight="700">5. Push</text>
    <text x="817" y="130" font-size="12">send to GitHub</text>
  </g>

  <!-- arrows between -->
  <g stroke="#8c959f" stroke-width="2.5" fill="#8c959f">
    <line x1="182" y1="115" x2="204" y2="115"/><polygon points="208,115 200,110 200,120"/>
    <line x1="360" y1="115" x2="382" y2="115"/><polygon points="386,115 378,110 378,120"/>
    <line x1="538" y1="115" x2="560" y2="115"/><polygon points="564,115 556,110 556,120"/>
    <line x1="716" y1="115" x2="738" y2="115"/><polygon points="742,115 734,110 734,120"/>
  </g>

  <!-- return arrow -->
  <path d="M 817 152 L 817 210 L 105 210 L 105 156" fill="none" stroke="#8c959f" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="105,152 100,160 110,160" fill="#8c959f"/>
  <text x="461" y="234" text-anchor="middle" font-size="13" fill="#57606a">next change — repeat</text>
</svg>
