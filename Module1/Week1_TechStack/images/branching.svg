<svg viewBox="0 0 820 300" width="820" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How a branch diverges from main and merges back</title>
  <desc>The main branch stays known-good. You create a feature branch, make commits on it, open a pull request, and merge it back into main.</desc>
  <rect x="0" y="0" width="820" height="300" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="819" height="299" rx="14" fill="none" stroke="#d0d7de"/>

  <!-- main line -->
  <line x1="60" y1="110" x2="760" y2="110" stroke="#1f2328" stroke-width="3"/>
  <text x="60" y="92" font-size="14" font-weight="700" fill="#1f2328">main</text>
  <text x="60" y="76" font-size="11" fill="#57606a">always the known-good version</text>

  <!-- main commits -->
  <g fill="#1f2328">
    <circle cx="120" cy="110" r="11"/>
    <circle cx="240" cy="110" r="11"/>
    <circle cx="700" cy="110" r="11"/>
  </g>

  <!-- branch line -->
  <path d="M 240 110 C 300 110, 300 210, 360 210 L 580 210 C 640 210, 640 110, 700 110" fill="none" stroke="#6e40c9" stroke-width="3"/>
  <text x="360" y="248" font-size="14" font-weight="700" fill="#6e40c9">feature branch</text>
  <text x="360" y="266" font-size="11" fill="#57606a">your experiment — main stays untouched</text>

  <!-- branch commits -->
  <g fill="#6e40c9">
    <circle cx="400" cy="210" r="11"/>
    <circle cx="490" cy="210" r="11"/>
    <circle cx="580" cy="210" r="11"/>
  </g>

  <!-- labels -->
  <text x="240" y="138" text-anchor="middle" font-size="11" fill="#57606a">create branch</text>
  <text x="700" y="92" text-anchor="middle" font-size="11" fill="#57606a">merge (via PR)</text>

  <!-- PR badge -->
  <rect x="600" y="150" width="150" height="30" rx="15" fill="#ddf4ff" stroke="#0969da"/>
  <text x="675" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">Pull Request</text>
</svg>
